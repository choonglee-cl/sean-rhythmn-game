<html>
  <head>
    <title>Endless Revolution</title>
    <link href="https://fonts.googleapis.com/css?family=Orbitron|Russo+One" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="icon" href="assets/images/rh_right.png">
    <link rel="stylesheet" type="text/css" href="assets/css/endless.css">

    <script>
      (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
      (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
      m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
      })(window,document,'script','https://www.google-analytics.com/analytics.js','ga');
      ga('create', 'UA-100350356-1', 'auto');
      ga('send', 'pageview');
    </script>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.2.4/jquery.min.js"></script>
    <script src="https://code.createjs.com/easeljs-0.8.2.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script type="application/javascript" src="./lib/bundle.js"></script>
  </head>
  <body>
    <!-- Player 1 Score (왼쪽 위) -->
    <div id="player1ScoreContainer" class="player-score-container">
      <h2>Player 1</h2>
      <p id="player1Score">0</p>
    </div>

    <!-- Player 2 Score (오른쪽 위) -->
    <div id="player2ScoreContainer" class="player-score-container">
      <h2>Player 2</h2>
      <p id="player2Score">0</p>
    </div>

    <section id="screen">
      <div id="board">
        <!-- Pause Menu -->
        <div id="pauseModal" class="pause-modal">
          <div class="pause-content">
            <h2>GAME PAUSED</h2>
            <div class="pause-buttons">
              <button type="button" id="resumeBtn">Resume</button>
              <button type="button" id="mainMenuBtn">Main Menu</button>
            </div>
          </div>
        </div>

        <!-- Game Over Modal -->
        <div id="gameOverModal" class="game-over-modal">
          <div class="game-over-content">
            <h2>GAME OVER!</h2>
            <div class="score-display">
              <div class="final-scores">
                <div class="player-score">
                  <h3>Player 1</h3>
                  <p id="finalPlayer1Score">0</p>
                </div>
                <div class="player-score">
                  <h3>Player 2</h3>
                  <p id="finalPlayer2Score">0</p>
                </div>
              </div>
              <div class="total-score">
                <h3>Total Score</h3>
                <p id="finalTotalScore">0</p>
              </div>
            </div>
            <div class="game-over-buttons">
              <button type="button" id="playAgainBtn">Play Again</button>
              <button type="button" id="goToMainBtn">Main Menu</button>
            </div>
          </div>
        </div>
        <canvas id="canvas" height="720" width="720"></canvas>
      </div>

    </section>
    
    <!-- 숨겨진 YouTube 플레이어 -->
    <div id="youtube-player" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100vw; height: 100vh; z-index: -1; opacity: 0.5; pointer-events: none;"></div>
  </body>
</html>
